<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agro Inteligente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>🌱 Agro Inteligente</h1>
  <p>Tecnologia + Sustentabilidade = Futuro</p>

  <button id="temaBtn">🌙 Tema</button>
</header>

<nav class="menu">
  <a href="#impacto">Impacto</a>
  <a href="#grafico">Gráfico</a>
  <a href="#usuario">Você</a>
</nav>

<section id="impacto" class="card">
  <h2>Simulador de Impacto</h2>

  <p>Ações sustentáveis:</p>
  <h1 id="contador">0</h1>

  <button onclick="add()">+ Ação</button>
  <button onclick="reset()">Resetar</button>
</section>

<section id="grafico" class="card">
  <h2>Visualização de Impacto</h2>

  <div class="barra-container">
    <div id="barra" class="barra"></div>
  </div>

  <p id="nivel">Nível: Inicial</p>
</section>

<section id="usuario" class="card">
  <h2>Seu impacto</h2>

  <label>Seu nome:</label>
  <input type="text" id="nome">

  <button onclick="mensagem()">Confirmar</button>

  <p id="resposta"></p>
</section>

<footer>
  <p>© 2026 Agro Inteligente</p>
</footer>

<script src="script.js"></script>
</body>
</html>
